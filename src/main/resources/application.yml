spring:
  config:
    import: optional:file:.env.local[.properties]
  application:
    name: modaflow-backend
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 101MB
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: 8080
  servlet:
    context-path: /api/v1

modaflow:
  linx-write:
    # Opt-in independente: trocar o leitor não habilita escrita nem herda credenciais.
    enabled: ${MODAFLOW_LINX_WRITE_ENABLED:false}
    review-enabled: ${MODAFLOW_LINX_WRITE_REVIEW_ENABLED:false}
    homolog-atual3: ${MODAFLOW_LINX_WRITE_HOMOLOG_ATUAL3:true}
    approved-schema-sha256: ${MODAFLOW_LINX_WRITE_APPROVED_SCHEMA_SHA256:}
    datasource:
      url: ${MODAFLOW_LINX_WRITE_URL:}
      username: ${MODAFLOW_LINX_WRITE_USERNAME:}
      password: ${MODAFLOW_LINX_WRITE_PASSWORD:}
  linx:
    enabled: ${MODAFLOW_LINX_ENABLED:false}
    # Aceita a conta administrativa informada, mas a integração continua expondo
    # apenas consultas e valida o destino homologado antes de usá-la.
    expected-database: ${MODAFLOW_LINX_EXPECTED_DATABASE:HOMOLOGACAO_ATUAL}
    allow-write-capable-credential: ${MODAFLOW_LINX_ALLOW_WRITE_CAPABLE_CREDENTIAL:true}
    datasource:
      url: ${MODAFLOW_LINX_DATASOURCE_URL:}
      username: ${MODAFLOW_LINX_DATASOURCE_USERNAME:}
      password: ${MODAFLOW_LINX_DATASOURCE_PASSWORD:}
      driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
      maximum-pool-size: 3
      minimum-idle: 0
      connection-timeout-ms: 10000
  jwt:
    # Required: supply a Base64-safe secret of at least 32 bytes through the environment.
    secret: ${MODAFLOW_JWT_SECRET}
    expiration-ms: 86400000 # 24 horas
  cors:
    allowed-origins: "http://localhost:5173,http://localhost:3000"
