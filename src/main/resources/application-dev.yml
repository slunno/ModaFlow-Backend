spring:
  datasource:
    # Conexão com Microsoft SQL Server (SQL Server Management Studio - SSMS)
    url: jdbc:sqlserver://localhost:1433;databaseName=modaflow_db;encrypt=true;trustServerCertificate=true;
    username: sa
    password: YourStrongPassword123
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.SQLServerDialect

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
